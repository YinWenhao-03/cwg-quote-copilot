[project]
name = "cwg-quote-copilot-backend"
version = "0.1.0"
description = "Local-first enterprise quote copilot prototype"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "httpx>=0.28",
  "huggingface-hub>=0.34",
  "jieba>=0.42.1",
  "langgraph>=0.6",
  "numpy>=2.1",
  "openpyxl>=3.1",
  "pydantic-settings>=2.7",
  "psycopg[binary]>=3.2",
  "pyjwt>=2.10",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "python-multipart>=0.0.20",
  "qdrant-client>=1.13",
  "reportlab>=4.2",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
]
full = [
  "docling>=2.70",
  "sentence-transformers>=3.4",
  "arize-phoenix-otel>=0.9",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "DTZ011"]
